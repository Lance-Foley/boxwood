# .ws/config.yml — Tier-2 smoke fixture (WITH database).
# Exercises boxwood's has_db=true path plus named-volume detection.
version: 1

main_branch: main

image:
  name: boxwood-smoke-db:latest
  dockerfile: .ws/Dockerfile
  # No dependency files to bake in — keeps `ws rebuild` to a few seconds and
  # avoids any read from origin/main.
  build_context_from_main: []

compose:
  template: .ws/docker-compose.template.yml
  app_service: app
  ready: healthcheck

ports:
  # Same offset pool as the no-DB fixture; the smoke harness runs them in
  # separate projects/repos so the range is never exhausted.
  range: [3100, 3105]

secrets_file: .env

# has_db=true: first-run setup runs db-init.sh; `ws db-restore` re-runs it.
db:
  restore_command: /usr/local/bin/db-init.sh

# No claude block.
