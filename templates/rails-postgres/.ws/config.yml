# .ws/config.yml — boxwood session recipe (Rails + Postgres starter).
#
# Generated by `ws init`. Edit everything below to match your repo, then run
# `ws rebuild` to build the base image and `ws attach --new "..."` to start.
version: 1

# Branch new sessions are cut from, and the diff/compare base.
main_branch: main

image:
  # Tag for THIS repo's golden base image (keep it repo-specific).
  name: app-dev:latest
  dockerfile: .ws/Dockerfile
  # Dependency files pulled from main and baked into the image for speed.
  build_context_from_main: [Gemfile, Gemfile.lock, package.json, yarn.lock]

compose:
  template: .ws/docker-compose.template.yml
  app_service: app          # the service ws wires logs / exec / port to
  ready: healthcheck        # ws waits on the app healthcheck (compose up --wait)

ports:
  range: [3000, 3005]       # host port pool; one session per port

# Copied from the main checkout into each worktree (API keys, secrets, etc.).
secrets_file: .env

# First-run DB setup runs db-init.sh; `ws db-restore` re-runs restore_command.
# Delete this whole block for an app with no database.
db:
  # restore_command is a shell command line, run via `sh -c` inside the app
  # container — so quoting, pipelines, and env-prefixes are preserved (e.g.
  # `RAILS_ENV=development bundle exec rake db:reset` works as written).
  restore_command: /usr/local/bin/db-init.sh
