# Per-session stack. boxwood substitutes __HOST_PORT__, __WORKTREE_PATH__,
# __REPO_ROOT__, and __DB_INIT__ when it generates the session's compose file.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: app_development
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    image: app-dev:latest
    # No `command:` override — the image CMD (foreman) runs the dev server, so it
    # self-heals on restart. boxwood tails its logs rather than launching it.
    environment:
      DATABASE_URL: postgres://postgres@db/app_development
      PORT: "__HOST_PORT__"
      BINDING: "0.0.0.0"
      DB_INIT: "__DB_INIT__"
    ports:
      - "__HOST_PORT__:__HOST_PORT__"
    volumes:
      - __WORKTREE_PATH__:/app
      - bundle_cache:/usr/local/bundle
      - node_cache:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - __WORKTREE_PATH__/.env
    stdin_open: true
    tty: true
    healthcheck:
      # Healthy once first-run init wrote the marker, or when no init was requested.
      test: ["CMD-SHELL", "test -f /tmp/.db_initialized || test \"$DB_INIT\" != 'true'"]
      interval: 2s
      timeout: 5s
      retries: 150
      start_period: 5s

  worker:
    image: app-dev:latest
    command: bundle exec rails solid_queue:start
    environment:
      DATABASE_URL: postgres://postgres@db/app_development
      # Skip dependency reconciliation in the entrypoint (app already did it).
      WS_ROLE: worker
    volumes:
      - __WORKTREE_PATH__:/app
      - bundle_cache:/usr/local/bundle
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - __WORKTREE_PATH__/.env
    restart: on-failure:3

volumes:
  pgdata:
  bundle_cache:
  node_cache:
