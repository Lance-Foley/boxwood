services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: wescomapp
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    image: wescomapp-dev:latest
    command: bundle exec puma -C config/puma.rb -b tcp://0.0.0.0:3000
    environment:
      DATABASE_URL: postgres://postgres@db/wescomapp
      SOLID_QUEUE_IN_PUMA: "false"
      PORT: "3000"
      DB_INIT: "__DB_INIT__"
    ports:
      - "__HOST_PORT__:3000"
    volumes:
      - __WORKTREE_PATH__:/app
      - __WESCOM_APP_PATH__/latest.dump:/dumps/latest.dump:ro
      - bundle_cache:/usr/local/bundle
      - node_cache:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - __WORKTREE_PATH__/.env

  css:
    image: wescomapp-dev:latest
    command: bundle exec rails tailwindcss:watch
    volumes:
      - __WORKTREE_PATH__:/app
      - bundle_cache:/usr/local/bundle
      - node_cache:/app/node_modules
    restart: unless-stopped

  worker:
    image: wescomapp-dev:latest
    command: bundle exec rails solid_queue:start
    environment:
      DATABASE_URL: postgres://postgres@db/wescomapp
      SOLID_QUEUE_IN_PUMA: "false"
    volumes:
      - __WORKTREE_PATH__:/app
      - bundle_cache:/usr/local/bundle
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - __WORKTREE_PATH__/.env
    restart: on-failure:3

volumes:
  pgdata:
  bundle_cache:
  node_cache:
